# Values measured on Ziad's RoboMaster EP (2026-10-26). See the report for how they were measured.
tag_detector:
  ros__parameters:
    target_id: 3
    tag_size: 0.155            # measured black edge of the printed tag (m)
    quad_decimate: 1.0
    init_arm: false            # arm is set by hand 2 cm above the ToF sensor (the A2 pose hits it)
    extrinsics: tag            # camera pose from the floor tag, not the (wrong) arm TF
    camera_pitch_deg: 5.3      # from the floor tag at 0.6-1.0 m, arm set by hand (router-mode session)
    range_scale: 1.0           # chassis-front distance = scale * camera forward + offset
    range_offset: -0.162       # median of (tape - camera forward), data/calibration/tag_range.csv rows 3-6 (final arm pose, 01:00-01:07)
flatness_planner:
  ros__parameters:
    control_rate: 20.0
    log_period: 1.0
    log_after_arrival: 3.0
    search_dir: 1.0
    drive_sign: -1.0           # driver +x points AWAY from the camera/tag (2 s wheels-in-air test, 2026-10-26)
    arm_x_saved: 0.123         # arm_position at which the camera was calibrated (2026-10-26, set by hand)
    arm_z_saved: 0.067
    arm_tolerance: 0.006
